name: RAG Platform CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  rag-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -q

  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install PHP dev dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax check
        run: find modules -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit site SEO tests
        run: vendor/bin/phpunit

  docker-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-platform
    steps:
      - uses: actions/checkout@v4
      - name: Build RAG API image
        run: docker build -t smyalichi-rag-api:test .
