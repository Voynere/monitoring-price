services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: smyalichi_rag
      POSTGRES_USER: smyalichi
      POSTGRES_PASSWORD: smyalichi
    ports:
      - "5432:5432"
    volumes:
      - rag_pg_data:/var/lib/postgresql/data
      - ./db/migrations/001_smyalichi_rag.sql:/docker-entrypoint-initdb.d/001_smyalichi_rag.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://smyalichi:smyalichi@postgres:5432/smyalichi_rag
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      LLM_BASE_URL: http://ollama:11434/v1
      EMBEDDING_DIMENSION: "1024"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - ollama
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8080"]

  rag-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://smyalichi:smyalichi@postgres:5432/smyalichi_rag
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      EMBEDDING_DIMENSION: "1024"
    depends_on:
      - postgres
      - rabbitmq
    command: ["python", "-m", "workers.index_worker"]

volumes:
  rag_pg_data:
  ollama_data:
