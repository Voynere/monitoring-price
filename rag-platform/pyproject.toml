[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smyalichi-rag-platform"
version = "0.1.0"
description = "Deep RAG runtime for Smyalichi Monitoring Price"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.6",
    "httpx>=0.27.0",
    "pika>=1.3.2",
    "redis>=5.2.0",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[project.scripts]
rag-ingest = "ingestors.smyalichi.cli:main"
rag-worker = "workers.index_worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ingestors*", "pipeline*", "retrieval*", "llm_gateway*", "api*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
